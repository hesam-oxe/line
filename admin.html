<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), midi=(), gyroscope=(), accelerometer=(), magnetometer=(), interest-cohort=(), idle-detection=()"/>

  <title>پنل مدیریت | لاین نوری استار</title>
  <meta name="description" content="پنل مدیریت فروشگاه و سفارش‌ها."/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#0a0a12"/>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/panels.css"/>
  <link rel="stylesheet" href="css/products.css"/>
</head>
<body>

  <header class="topbar">
    <div class="container topbar-in">
      <a class="logo" href="index.html" aria-label="بازگشت به سایت اصلی">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="4" y="17" width="32" height="6" rx="3" fill="#FFB800"/>
          <rect x="10" y="4" width="6" height="32" rx="3" fill="#8B5CF6" opacity="0.85"/>
          <circle cx="20" cy="20" r="3.4" fill="#fff"/>
        </svg>
        <span>پنل <b>مدیریت</b></span>
      </a>
      <nav class="topbar-nav" aria-label="میانبر">
        <a href="index.html" target="_blank" rel="noopener">مشاهده سایت</a>
        <a href="products.html" target="_blank" rel="noopener">فروشگاه</a>
      </nav>
      <div class="topbar-side" id="adminSide"></div>
    </div>
  </header>

  <div class="container panel">
    <aside class="p-sidebar" aria-label="منوی پنل مدیریت">
      <nav class="p-nav" id="pNav">
        <button type="button" data-view="dash" class="on">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8M5 10v10h5v-6h4v6h5V10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label-desktop">داشبورد</span>
        </button>
        <button type="button" data-view="products">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3.3 8.4L12 13l8.7-4.6M12 21v-8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span class="nav-label-desktop">محصولات</span>
          <span class="nav-count" id="cProducts" hidden></span>
        </button>
        <button type="button" data-view="quotes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10a2 2 0 0 1 2 2v16l-4-3H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 8h6M9 12h4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label-desktop">استعلام‌ها</span>
          <span class="nav-count" id="cQuotes" hidden></span>
        </button>
        <button type="button" data-view="msgs">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-8 8H4l2-3a8 8 0 1 1 15-5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          <span class="nav-label-desktop">پیام‌ها</span>
          <span class="nav-count" id="cMsgs" hidden></span>
        </button>
        <button type="button" data-view="users">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M2.5 20c1.2-3.4 4-4.8 6.5-4.8s5.3 1.4 6.5 4.8M16 4.5a3.5 3.5 0 0 1 0 7M17.5 15.4c2 .6 3.4 2 4 4.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="nav-label-desktop">کاربران</span>
          <span class="nav-count" id="cUsers" hidden></span>
        </button>
        <div class="nav-sep"></div>
        <button type="button" data-view="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="nav-label-desktop">تنظیمات</span>
        </button>
        <button type="button" id="logoutBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="nav-label-desktop">خروج</span>
        </button>
      </nav>
    </aside>

    <main class="p-main" id="pMain" aria-live="polite"></main>
  </div>

  <script defer src="js/store.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/admin.js"></script>
</body>
</html>
