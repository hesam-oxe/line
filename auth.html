<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"/>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), midi=(), gyroscope=(), accelerometer=(), magnetometer=(), interest-cohort=(), idle-detection=()"/>

  <title>ورود / ثبت‌نام | لاین نوری استار</title>
  <meta name="description" content="ورود به پنل کاربری لاین نوری استار — پیگیری استعلام قیمت، پیام‌ها و سفارش‌ها."/>
  <meta name="robots" content="noindex, nofollow"/>
  <meta name="theme-color" content="#0a0a12"/>

  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="manifest.webmanifest"/>

  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/panels.css"/>
</head>
<body>

  <a class="btn btn-outline btn-sm auth-home" href="index.html">بازگشت به سایت</a>

  <main class="auth-wrap">
    <div class="auth-glow g1" aria-hidden="true"></div>
    <div class="auth-glow g2" aria-hidden="true"></div>

    <div class="auth-card">
      <div class="auth-logo">
        <svg class="logo-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
          <rect x="4" y="17" width="32" height="6" rx="3" fill="#FFB800"/>
          <rect x="10" y="4" width="6" height="32" rx="3" fill="#8B5CF6" opacity="0.85"/>
          <circle cx="20" cy="20" r="3.4" fill="#fff"/>
        </svg>
        <span>لاین نوری <b>استار</b></span>
      </div>
      <p class="auth-tag">به پنل کاربری خوش آمدید — استعلام‌ها، پیام‌ها و پیش‌فاکتورها اینجا هستند.</p>

      <div class="auth-tabs" role="tablist" aria-label="ورود یا ثبت‌نام">
        <button type="button" id="tabLogin" class="on" role="tab" aria-selected="true">ورود</button>
        <button type="button" id="tabReg" role="tab" aria-selected="false">ثبت‌نام</button>
      </div>

      <!-- ── فرم ورود ── -->
      <form id="loginForm" novalidate>
        <div class="p-field">
          <label for="lIdent">ایمیل یا شماره موبایل</label>
          <input id="lIdent" type="text" inputmode="email" autocomplete="username" maxlength="80" placeholder="admin@example.com یا ۰۹۱۲…"/>
          <small class="field-error" aria-live="polite"></small>
        </div>
        <div class="p-field">
          <label for="lPass">گذرواژه</label>
          <input id="lPass" type="password" autocomplete="current-password" maxlength="64" placeholder="••••••••"/>
          <small class="field-error" aria-live="polite"></small>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="loginBtn">ورود به پنل</button>
      </form>

      <!-- ── فرم ثبت‌نام ── -->
      <form id="regForm" hidden novalidate>
        <div class="p-field">
          <label for="rName">نام و نام خانوادگی</label>
          <input id="rName" type="text" autocomplete="name" maxlength="60" placeholder="مثلاً: علی رضایی"/>
          <small class="field-error" aria-live="polite"></small>
        </div>
        <div class="form-row">
          <div class="p-field">
            <label for="rPhone">شماره موبایل</label>
            <input id="rPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="16" placeholder="۰۹۱۲ ـ ـ ـ ـ ـ ـ"/>
            <small class="field-error" aria-live="polite"></small>
          </div>
          <div class="p-field">
            <label for="rEmail">ایمیل</label>
            <input id="rEmail" type="email" inputmode="email" autocomplete="email" maxlength="80" placeholder="you@example.com"/>
            <small class="field-error" aria-live="polite"></small>
          </div>
        </div>
        <div class="p-field">
          <label for="rPass">گذرواژه</label>
          <input id="rPass" type="password" autocomplete="new-password" maxlength="64" placeholder="حداقل ۸ کاراکتر، حرف + عدد"/>
          <div class="pass-meter" aria-hidden="true"><i id="meter"></i></div>
          <small class="field-error" aria-live="polite"></small>
        </div>
        <div class="p-field">
          <label for="rPass2">تکرار گذرواژه</label>
          <input id="rPass2" type="password" autocomplete="new-password" maxlength="64" placeholder="همان گذرواژه"/>
          <small class="field-error" aria-live="polite"></small>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="regBtn">ساخت حساب کاربری</button>
      </form>

      <p class="auth-foot">با ورود، <a href="index.html">قوانین استفاده</a> را می‌پذیرید. اطلاعات شما فقط در همین مرورگر نگهداری می‌شود.</p>
    </div>
  </main>

  <script defer src="js/store.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/auth.js"></script>
</body>
</html>
